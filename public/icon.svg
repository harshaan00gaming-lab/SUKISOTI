<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e38" />
      <stop offset="45%" stop-color="#3b156b" />
      <stop offset="85%" stop-color="#fd4386" />
      <stop offset="100%" stop-color="#ffb142" />
    </linearGradient>
    <linearGradient id="speedRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff6b08" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for PWA icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Speed Perspective Track Lines (Subway Surfers Rails) -->
  <g opacity="0.6">
    <!-- Center horizon vanishing point at 256, 170 -->
    <path d="M 230 170 L 40 512" stroke="#ff80bf" stroke-width="6" stroke-linecap="round" />
    <path d="M 246 170 L 175 512" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" />
    <path d="M 266 170 L 337 512" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" />
    <path d="M 282 170 L 472 512" stroke="#ff80bf" stroke-width="6" stroke-linecap="round" />

    <!-- Railway Ties / Sleepers -->
    <line x1="210" y1="230" x2="302" y2="230" stroke="#f3a683" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="185" y1="285" x2="327" y2="285" stroke="#f3a683" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <line x1="150" y1="355" x2="362" y2="355" stroke="#f3a683" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="100" y1="440" x2="412" y2="440" stroke="#f3a683" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Dynamic Glowing Runner Lightning Streak (Suki Soti "S" Emblem) -->
  <path d="M 330 90 L 190 250 L 290 260 L 170 430 L 350 220 L 250 210 Z" 
        fill="url(#lightning)" 
        filter="url(#glow)" />

  <!-- Speed Trails / Wind Lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="340" y1="130" x2="440" y2="130" />
    <line x1="370" y1="165" x2="460" y2="165" />
    <line x1="80" y1="320" x2="160" y2="320" />
    <line x1="60" y1="360" x2="130" y2="360" />
  </g>

  <!-- Sparkling Star Pickups -->
  <circle cx="160" cy="140" r="10" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="390" cy="300" r="8" fill="#ffd166" filter="url(#glow)" />
  <circle cx="110" cy="220" r="6" fill="#ffffff" />

  <!-- SUKISOTI Stylized Wordmark -->
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="6" 
        fill="#ffffff" 
        stroke="#1a0933" 
        stroke-width="5" 
        paint-order="stroke fill">SUKISOTI</text>
</svg>
